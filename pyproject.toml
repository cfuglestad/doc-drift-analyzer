[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-drift-analyzer"
version = "0.1.0"
description = "Analyze meaningful changes between versions of structured documents."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Connor Fuglestad" }]
keywords = ["document-analysis", "nlp", "semantic-diff", "streamlit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "pypdf>=5.0,<7",
  "python-docx>=1.1,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
semantic = [
  "sentence-transformers>=5.2,<6",
]
dev = [
  "black>=25.1,<26",
  "mypy>=1.14,<1.20",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/cfuglestad/doc-drift-analyzer"
Issues = "https://github.com/cfuglestad/doc-drift-analyzer/issues"
Repository = "https://github.com/cfuglestad/doc-drift-analyzer"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
